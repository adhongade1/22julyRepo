# generate the workflow which provide the ability to choose the job to run in the workflow
name: capture logs
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      print_tags:
        description: 'True to print to STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test scenario tags'
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

jobs:
  print-tag:
    runs-on: ubuntu-latest
    if: ${{ inputs.print_tags }} 
    steps:
      - name: Print the input tag to STDOUT
        run: |
          echo  The log level are ${{ inputs.logLevel }} 
          echo  The print tags are ${{ inputs.print_tags }} 
          echo  The tags are ${{ inputs.tags }} 
          echo  The environment is ${{ inputs.environment }}
